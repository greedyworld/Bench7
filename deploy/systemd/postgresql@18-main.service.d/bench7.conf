# Drop-in for the PGDG unit: the cluster lives on /data (ephemeral local NVMe).
# Wait for bench7-data (re-creates /data when the local disk is blank) and refuse to start
# loudly when the data dir is gone (then: sudo ./scripts/install-pg.sh && sudo ./db/reseed.sh).
[Unit]
Wants=bench7-data.service
After=bench7-data.service
RequiresMountsFor=/data
AssertPathExists=/data/pg/18/main/PG_VERSION

[Service]
LimitNOFILE=65536
