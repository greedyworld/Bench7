[package]
name = "bench7-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "derive"] }
uuid = { version = "1", features = ["v7", "serde", "std"] }
moka = { version = "0.12", features = ["future"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
