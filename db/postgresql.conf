# bench7 Postgres settings for a 2 vCPU / 4 GB box shared with the app.
# Installed as /etc/postgresql/18/main/conf.d/bench7.conf (native, systemd).
# No resource limits anywhere. Memory plan: OS ~0.4 GB, shared_buffers 768 MB
# in explicit huge pages, the app takes what it needs, the rest is page cache
# for the ~30 GB data set.
listen_addresses = '127.0.0.1'
port = 5432
# pool sweeps go up to DB_POOL_TOTAL=48; headroom for psql, the sampler and autovacuum
max_connections = 100

shared_buffers = 768MB
effective_cache_size = 2GB
work_mem = 4MB
maintenance_work_mem = 256MB
huge_pages = try

wal_level = replica
# durability: an acked write is on disk (the apps reply after their batch transaction commits);
# the cluster is created with --data-checksums (scripts/install-pg.sh)
fsync = on
full_page_writes = on
synchronous_commit = on
wal_buffers = 64MB
# 16 GB / 4 GB is the target for a dedicated DB disk (db/postgresql-dbhost.conf); here the
# 40 GB disk holds ~31 GB of data with the full seed, so WAL is capped lower
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
# lz4: full-page images after each checkpoint otherwise burst WAL to ~150 MB/s
wal_compression = lz4
# group commit: a committing backend waits 200 us for others when >= 5 transactions are
# open, then one WAL flush covers all of them
commit_delay = 200
commit_siblings = 5

random_page_cost = 1.1
effective_io_concurrency = 200
io_method = worker
io_workers = 2

max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 1
jit = off

autovacuum = on
autovacuum_max_workers = 2
# Throttled: unthrottled autovacuum read 245 MB/s (the disk's ceiling) and
# stalled every request mid-ramp. 200 / 20ms = ~40 MB/s read, ~4 MB/s dirtied.
autovacuum_vacuum_cost_limit = 200
autovacuum_vacuum_cost_delay = 20ms

track_io_timing = on
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
log_min_duration_statement = -1
log_checkpoints = on
# autovacuum is off on the bench tables (db/reset.sql vacuums between runs);
# log every one that still runs (catalogs, anti-wraparound) so it shows in reports
log_autovacuum_min_duration = 0
