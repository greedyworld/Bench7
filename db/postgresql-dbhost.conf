# bench7 Postgres overrides for the 2-machine setup: Postgres alone on its own
# 2 vCPU / 4 GB box, the app on another one. Installed after db/postgresql.conf as
# conf.d/zz-bench7-dbhost.conf (later file wins) by: sudo PG_ROLE=dbhost ./scripts/install-pg.sh
# Every value that differs from the 1-machine file is here, with the reason.

# reachable from the app host (pg_hba allows only PG_ALLOW_CIDR with scram-sha-256)
listen_addresses = '*'
# pool sweeps go up to 48 connections; headroom for psql, sampler, autovacuum
max_connections = 100

# no app on this box: 25 % of RAM for shared_buffers (huge pages), the rest is page cache
shared_buffers = 1GB
effective_cache_size = 3GB
wal_buffers = 64MB
# a bigger /data partition on this box (DATA_GB=80): fewer forced checkpoints under write load
max_wal_size = 16GB
min_wal_size = 4GB

# the 2 vCPUs belong to Postgres: one more I/O worker, background writer a bit more active
io_workers = 3
bgwriter_delay = 50ms
bgwriter_lru_maxpages = 400

# group commit: with synchronous_commit = on every commit waits for a WAL flush; a committing
# backend waits 200 us when >= 5 transactions are open so one flush covers all of them
# (helps Group 2's single-row INSERTs and the parallel batch lanes of Group 1).
# Override per setup: ./tune_postgres2.sh --set commit_delay=<us>
commit_delay = 200
commit_siblings = 5
